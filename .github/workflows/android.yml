name: Android CI

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths:
      - "manager/app/src/**/*.kt"
      - "manager/build.gradle.kts"
      - "manager/gradle/libs.versions.toml"
      - "manager/app/src/**/*.c"
      - "userspace/init/**"
  pull_request:
    branches: [ "main" ]
    paths:
      - "manager/app/src/**/*.kt"
      - "manager/build.gradle.kts"
      - "manager/gradle/libs.versions.toml"
      - "manager/app/src/**/*.c"
      - "userspace/init/**"

jobs:
  build-lkm:
    uses: ./.github/workflows/build-lkm.yml

  build:
    needs: build-lkm
    runs-on: ubuntu-latest
    env:
      NDK_VERSION: r29
      ANDROID_NDK_API_LEVEL: "28"
      ANDROID_NDK_HOME: ${{ github.workspace }}/android-ndk
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Clone ncore
      run: |
        git clone --recursive https://github.com/aqnya/ncore.git userspace/ncore

    - name: Set up JDK 25
      uses: actions/setup-java@v6
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: gradle

    - name: Cache Android NDK
      id: ndk-cache
      uses: actions/cache@v6
      with:
        path: ${{ env.ANDROID_NDK_HOME }}
        key: android-ndk-${{ env.NDK_VERSION }}

    - name: Install the Android NDK
      if: steps.ndk-cache.outputs.cache-hit != 'true'
      run: |
        set -euo pipefail
        url="https://dl.google.com/android/repository/android-ndk-${NDK_VERSION}-linux.zip"
        curl -fSL --retry 3 -o ndk.zip "$url"
        rm -rf "$ANDROID_NDK_HOME" android-ndk-"$NDK_VERSION"
        unzip -q ndk.zip
        mv android-ndk-"$NDK_VERSION" "$ANDROID_NDK_HOME"
        rm -f ndk.zip

    - name: Download LKM artifacts
      uses: actions/download-artifact@v8
      with:
        path: lkm-artifacts

    - name: Prepare KOs (assets)
      run: |
        find lkm-artifacts -name '*_nksu.ko' -exec cp {} manager/app/src/main/assets/ \;
        ls -la manager/app/src/main/assets/

    - name: Install bazelisk
      env:
        BAZELISK_VERSION: 'v1.29.0'
      run: |
        set -euxo pipefail
        case "$(uname -m)" in
          x86_64|amd64)  arch=amd64 ;;
          aarch64|arm64) arch=arm64 ;;
          *) echo "no bazelisk release for $(uname -m)" >&2; exit 1 ;;
        esac
        url="https://github.com/bazelbuild/bazelisk/releases/download/${BAZELISK_VERSION}/bazelisk-linux-${arch}"
        install_dir="$HOME/.local/bin"
        mkdir -p "$install_dir"
        curl -fsSL --retry 3 --retry-connrefused --retry-delay 2 \
          -o "$install_dir/bazelisk" "$url"
        chmod 0755 "$install_dir/bazelisk"
        ln -sf bazelisk "$install_dir/bazel"
        echo "$install_dir" >> "$GITHUB_PATH"

    - name: Build ncore (arm64-v8a)
      working-directory: userspace/ncore
      run: |
        bazel build //:ncore --config=android

        mkdir -p ../../manager/app/src/main/jniLibs/arm64-v8a
        cp bazel-bin/ncore ../../manager/app/src/main/jniLibs/arm64-v8a/libncore.so
        file ../../manager/app/src/main/jniLibs/arm64-v8a/libncore.so

    - name: Copy install script to assets
      run: |
        ls -la manager/app/src/main/assets/

    - name: Build init (arm64-v8a)
      env:
        API_LEVEL: 29
      run: |
        NDK_TOOLCHAIN="${ANDROID_NDK_HOME}/toolchains/llvm/prebuilt/linux-x86_64/bin"
        cmake -S userspace/init -B build/init-arm64-v8a \
          -DCMAKE_TOOLCHAIN_FILE=${ANDROID_NDK_HOME}/build/cmake/android.toolchain.cmake \
          -DANDROID_ABI=arm64-v8a \
          -DANDROID_PLATFORM=android-${API_LEVEL}
        cmake --build build/init-arm64-v8a
        cp build/init-arm64-v8a/init manager/app/src/main/jniLibs/arm64-v8a/libinit.so
        file manager/app/src/main/jniLibs/arm64-v8a/libinit.so

        # init 保留备用 (默认安装流程不使用), 放入 assets 供脚本可选调用
        cp build/init-arm64-v8a/init manager/app/src/main/assets/init
        chmod 0755 manager/app/src/main/assets/init

    - name: Decode Release Keystore
      run: |
        echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > manager/release.keystore

    - name: Build with Gradle
      working-directory: manager
      env:
        KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
      run: ./gradlew assembleRelease --no-daemon

    - name: Upload Release Artifact
      uses: actions/upload-artifact@v7
      with:
        name: release
        path: manager/app/build/outputs/apk/release/*.apk
