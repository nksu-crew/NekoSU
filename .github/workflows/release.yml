# SPDX-License-Identifier: GPL-3.0-or-later
name: Publish release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to publish (for example v1.0.6-beta.5)'
        required: true
        type: string
      notes:
        description: 'Release notes'
        required: false
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Find the build run for this tag
        id: run
        run: |
          set -euo pipefail
          run_id="$(gh run list --workflow build.yml --branch "$TAG" --limit 1 --json databaseId --jq '.[0].databaseId')"
          if [ -z "$run_id" ] || [ "$run_id" = "null" ]; then
            echo "No build run found for $TAG" >&2
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"

      - name: Download build artifacts
        run: |
          set -euo pipefail
          gh run download "${{ steps.run.outputs.run_id }}" -D artifacts
          find artifacts -maxdepth 3 -type f -printf '%p %s\n'

      - name: Collect assets
        run: |
          set -euo pipefail
          mkdir -p release-assets

          mapfile -t apks < <(find artifacts -type f -name '*.apk')
          if [ "${#apks[@]}" -ne 1 ]; then
            echo "expected exactly one APK artifact, found ${#apks[@]}" >&2
            exit 1
          fi
          cp "${apks[0]}" "release-assets/NekoSU-${TAG}.apk"

          mapfile -t kos < <(find artifacts -type f -name '*_nksu.ko')
          if [ "${#kos[@]}" -eq 0 ]; then
            echo "no kernel module artifacts found" >&2
            exit 1
          fi
          for ko in "${kos[@]}"; do
            cp "$ko" release-assets/
          done

          (cd release-assets && sha256sum * > SHA256SUMS)
          ls -lh release-assets

      - name: Publish the release
        run: |
          set -euo pipefail
          title="NekoSU ${TAG}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --clobber
            gh release edit "$TAG" --title "$title" --draft=false --prerelease --notes "${{ inputs.notes }}"
          else
            gh release create "$TAG" --title "$title" --prerelease --notes "${{ inputs.notes }}" release-assets/*
          fi
